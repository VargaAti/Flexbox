<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="kozep">
        <div class="kozep-doboz">Középen vagyok</div>
    </div>
    <div class="container">
        <div class="box box1">1 Megérett a meggy</div>
        <div class="box box2">2 csipkebokor vessző</div>
        <div class="box box3">3 te leszel a párom</div>
        <div class="box box4">4 Hess te dongó légy</div>
        <div class="box box5">5 Érik a tök</div>
        <div class="box box6">6 hasad a pad</div>
        <div class="box box7">7 dörög az ég</div>
        <div class="box box8">8 üres a polc</div>
        <div class="box box9">9 kis ferec</div>
        <div class="box box10">10 tiszta víz</div>
    </div>
</body>
</html>
